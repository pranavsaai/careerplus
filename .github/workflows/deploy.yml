name: CareerPlus CI/CD Pipeline

on:
  push:
    branches: [ clean-main ]
  pull_request:
    branches: [ clean-main ]

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────────────────────
  build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        working-directory: interviewai
        run: mvn clean package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: careerplus-jar
          path: interviewai/target/interviewai-0.0.1-SNAPSHOT.jar
          retention-days: 1

  # ── Job 2: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/clean-main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting CareerPlus deployment..."

            cd /home/ubuntu/careerplus

            echo "📥 Pulling latest code..."
            git fetch origin
            git checkout clean-main
            git reset --hard origin/clean-main

            echo "🔨 Building Spring Boot app..."
            cd interviewai
            mvn clean package -DskipTests

            echo "🔄 Restarting service..."
            sudo systemctl restart careerplus

            echo "⏳ Waiting for startup..."
            sleep 10

            echo "✅ Checking health..."
            curl -f http://localhost:8080/health && echo "✅ Deployment successful!" || echo "❌ Health check failed!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ CareerPlus deployed successfully to EC2!"
          else
            echo "❌ Deployment failed!"
          fi